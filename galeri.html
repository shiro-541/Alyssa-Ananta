<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Galeri — Alyssa Ananta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="preloader" id="preloader">
    <div class="preloader-ring"></div>
    <div class="preloader-text">Galeri</div>
</div>
<div class="scroll-progress" id="scrollProgress"></div>
<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"></div>

<nav id="navbar">
    <a href="index.html" class="logo magnetic">A</a>
    <button class="menu-toggle" id="menuToggle" aria-label="Menu">
        <span></span><span></span><span></span>
    </button>
    <ul id="navMenu">
        <li><a href="index.html">Beranda</a></li>
        <li><a href="karier.html">Karier</a></li>
        <li><a href="biodata.html">Biodata</a></li>
        <li><a href="favorite.html">Favorite</a></li>
        <li><a href="pencapaian.html">Pencapaian</a></li>
        <li><a href="lagu.html">Lagu</a></li>
        <li><a href="sosmed.html">Sosial</a></li>
        <li><a href="galeri.html" class="active">Galeri</a></li>
    </ul>
</nav>

<section class="page-hero">
    <h1>Galeri</h1>
    <p class="page-subtitle">Koleksi Foto</p>
</section>

<section class="galeri">
    <div class="galeri-grid">
        <div class="gallery-item" onclick="openLightbox(this)"><img src="foto/foto6.jpeg" alt="1" loading="lazy"></div>
        <div class="gallery-item" onclick="openLightbox(this)"><img src="foto/foto2.jpeg" alt="2" loading="lazy"></div>
        <div class="gallery-item" onclick="openLightbox(this)"><img src="foto/foto3.jpeg" alt="3" loading="lazy"></div>
        <div class="gallery-item" onclick="openLightbox(this)"><img src="foto/foto4.jpeg" alt="4" loading="lazy"></div>
        <div class="gallery-item" onclick="openLightbox(this)"><img src="foto/foto5.jpeg" alt="5" loading="lazy"></div>
        <div class="gallery-item" onclick="openLightbox(this)"><img src="foto/foto9.jpeg" alt="6" loading="lazy"></div>
        <div class="gallery-item" onclick="openLightbox(this)"><img src="foto/foto7.jpeg" alt="7" loading="lazy"></div>
        <div class="gallery-item" onclick="openLightbox(this)"><img src="foto/foto8.jpeg" alt="8" loading="lazy"></div>
    </div>
</section>

<div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <img src="" alt="Lightbox" id="lightboxImg">
</div>

<footer>© 2026 Shiro</footer>

<script>
    window.addEventListener('load', () => {
        setTimeout(() => document.getElementById('preloader').classList.add('hidden'), 1000);
    });

    const menuToggle = document.getElementById('menuToggle');
    const navMenu = document.getElementById('navMenu');
    menuToggle.addEventListener('click', () => {
        menuToggle.classList.toggle('active');
        navMenu.classList.toggle('active');
    });
    navMenu.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
            menuToggle.classList.remove('active');
            navMenu.classList.remove('active');
        });
    });

    const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

    if (!isTouchDevice) {
        const cursorDot = document.getElementById('cursorDot');
        const cursorRing = document.getElementById('cursorRing');
        let mouseX = 0, mouseY = 0, ringX = 0, ringY = 0;
        document.addEventListener('mousemove', e => {
            mouseX = e.clientX; mouseY = e.clientY;
            cursorDot.style.left = mouseX + 'px';
            cursorDot.style.top = mouseY + 'px';
        });
        (function animate() {
            ringX += (mouseX - ringX) * 0.15;
            ringY += (mouseY - ringY) * 0.15;
            cursorRing.style.left = ringX + 'px';
            cursorRing.style.top = ringY + 'px';
            requestAnimationFrame(animate);
        })();
        document.querySelectorAll('a, .gallery-item').forEach(el => {
            el.addEventListener('mouseenter', () => cursorRing.classList.add('hover'));
            el.addEventListener('mouseleave', () => cursorRing.classList.remove('hover'));
        });
    }

    window.addEventListener('scroll', () => {
        const p = (window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100;
        document.getElementById('scrollProgress').style.width = p + '%';
        const navbar = document.getElementById('navbar');
        if (window.scrollY > 80) navbar.classList.add('scrolled');
        else navbar.classList.remove('scrolled');
    }, { passive: true });

    const observer = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.1 });
    document.querySelectorAll('.gallery-item').forEach(el => observer.observe(el));

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');

    function openLightbox(el) {
        lightboxImg.src = el.querySelector('img').src;
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
    }

    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

    if (!isTouchDevice) {
        document.querySelectorAll('.magnetic').forEach(el => {
            el.addEventListener('mousemove', e => {
                const r = el.getBoundingClientRect();
                el.style.transform = `translate(${(e.clientX-r.left-r.width/2)*0.3}px,${(e.clientY-r.top-r.height/2)*0.3}px)`;
            });
            el.addEventListener('mouseleave', () => el.style.transform = '');
        });
    }

    document.addEventListener('click', e => {
        if (e.target.closest('a') || isTouchDevice) return;
        for (let i = 0; i < 8; i++) {
            const dot = document.createElement('div');
            const colors = ['#c41e3a', '#800020', '#5c0018', '#e63950'];
            const color = colors[i % colors.length];
            dot.style.cssText = `position:fixed;left:${e.clientX}px;top:${e.clientY}px;width:6px;height:6px;background:${color};border-radius:50%;pointer-events:none;z-index:9998;transition:all 0.9s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 0 15px ${color};`;
            document.body.appendChild(dot);
            const angle = (Math.PI * 2 * i) / 8;
            const dist = 60 + Math.random() * 70;
            setTimeout(() => {
                dot.style.transform = `translate(${Math.cos(angle)*dist}px,${Math.sin(angle)*dist}px)`;
                dot.style.opacity = '0';
            }, 10);
            setTimeout(() => dot.remove(), 1000);
        }
    });
</script>

<script src="extra.js"></script>
</body>
</html>
